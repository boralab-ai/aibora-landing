<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게시판 | 이보라 — AI 리터러시 강사</title>
<meta name="description" content="AI 강의와 활용에 대해 궁금한 점을 남기는 공간입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .page-header {
    padding: clamp(2.75rem, 7vw, 4rem) 1.75rem 2.5rem;
    max-width: 720px;
    margin: 0 auto;
  }

  .page-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 4vw, 2.5rem);
    line-height: 1.1;
    margin: 0 0 0.75rem;
    text-wrap: balance;
  }

  .page-desc {
    color: var(--ink-soft);
    max-width: 46ch;
    margin: 0;
  }

  .board-notice {
    margin: 1.1rem 0 0;
    padding: 0.9rem 1.1rem;
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 0.92rem;
    line-height: 1.65;
    max-width: 52ch;
  }

  .board-toolbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .board-count {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  .board-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .board-row {
    border-top: 1px solid var(--line);
  }
  .board-row:last-child { border-bottom: 1px solid var(--line); }

  .board-row button {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.4rem;
    background: none;
    border: none;
    padding: 1.15rem 0;
    text-align: left;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }

  .board-row-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.08rem;
  }

  .board-row-meta {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .board-empty {
    padding: 2.5rem 0;
    color: var(--ink-soft);
    text-align: center;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  form.board-form {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .field label {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .field input,
  .field textarea {
    font-family: var(--font-body);
    font-size: 1rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.75rem 0.9rem;
  }

  .field textarea {
    min-height: 9rem;
    line-height: 1.6;
    resize: vertical;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
  }

  @media (max-width: 560px) {
    .field-row { grid-template-columns: 1fr; }
  }

  .detail-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.65rem;
    line-height: 1.3;
    margin: 0 0 0.6rem;
    text-wrap: balance;
  }

  .detail-meta {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: 0 0 1.75rem;
  }

  .detail-content {
    white-space: pre-wrap;
    color: var(--ink);
    max-width: 58ch;
    margin: 0 0 2.25rem;
  }

  .detail-actions {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html">이보라</a>
    <div class="links">
      <a href="index.html#about">소개</a>
      <a href="index.html#topics">강의 주제</a>
      <a href="board.html" aria-current="page">게시판</a>
      <a href="index.html#consult">출강 문의</a>
    </div>
  </div>
</nav>

<header class="page-header">
  <p class="eyebrow">Board</p>
  <h1 class="page-title">게시판</h1>
  <p class="page-desc">강의나 AI 활용에 대해 궁금한 점을 자유롭게 남겨주세요.</p>
  <p class="board-notice">안내 · 지금은 시험 운영 중이라, 남기신 글이 <strong>이 기기의 브라우저에만</strong> 저장됩니다. 강사에게 전달되지 않으니 답변이 필요한 문의는 <a href="index.html#consult">출강 문의</a> 또는 메일을 이용해 주세요.</p>
</header>

<section id="view-list">
  <div class="board-toolbar">
    <span class="board-count" id="board-count"></span>
    <button type="button" class="btn btn-primary" id="btn-new">글쓰기</button>
  </div>
  <ul class="board-list" id="board-list"></ul>
  <p class="board-empty" id="board-empty" hidden>아직 등록된 글이 없습니다. 첫 번째 글을 남겨보세요.</p>
</section>

<section id="view-write" hidden>
  <p class="section-label">글쓰기</p>
  <form class="board-form" id="write-form">
    <div class="field-row">
      <div class="field">
        <label for="f-title">제목</label>
        <input type="text" id="f-title" maxlength="80" required>
      </div>
      <div class="field">
        <label for="f-author">이름</label>
        <input type="text" id="f-author" maxlength="20" required>
      </div>
    </div>
    <div class="field">
      <label for="f-content">내용</label>
      <textarea id="f-content" maxlength="2000" required></textarea>
    </div>
    <div class="cta-row">
      <button type="submit" class="btn btn-primary">등록</button>
      <button type="button" class="btn btn-ghost" id="btn-cancel-write">취소</button>
    </div>
  </form>
</section>

<section id="view-detail" hidden>
  <p class="section-label">글 보기</p>
  <h2 class="detail-title" id="d-title"></h2>
  <p class="detail-meta" id="d-meta"></p>
  <p class="detail-content" id="d-content"></p>
  <div class="detail-actions">
    <button type="button" class="btn btn-ghost" id="btn-back">목록으로</button>
    <button type="button" class="btn btn-danger" id="btn-delete">삭제</button>
  </div>
</section>

<footer>
  <span class="footer-name">이보라</span>
  <span>© 2026 이보라. AI 리터러시 강사</span>
</footer>

<script>
(function () {
  var STORAGE_KEY = 'bora-board-posts';

  function loadPosts() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function savePosts(posts) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    } catch (e) {}
  }

  function formatToday() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '.' + m + '.' + day;
  }

  var posts = loadPosts();
  var activePostId = null;

  var viewList = document.getElementById('view-list');
  var viewWrite = document.getElementById('view-write');
  var viewDetail = document.getElementById('view-detail');
  var listEl = document.getElementById('board-list');
  var emptyEl = document.getElementById('board-empty');
  var countEl = document.getElementById('board-count');

  function showView(view) {
    [viewList, viewWrite, viewDetail].forEach(function (v) {
      v.hidden = v !== view;
    });
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function renderList() {
    listEl.innerHTML = '';
    var sorted = posts.slice().sort(function (a, b) { return b.id - a.id; });
    countEl.textContent = '전체 ' + sorted.length + '건';
    emptyEl.hidden = sorted.length > 0;

    sorted.forEach(function (post) {
      var li = document.createElement('li');
      li.className = 'board-row';

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.addEventListener('click', function () { openDetail(post.id); });

      var title = document.createElement('span');
      title.className = 'board-row-title';
      title.textContent = post.title;

      var meta = document.createElement('span');
      meta.className = 'board-row-meta';
      meta.textContent = post.author + ' · ' + post.date + ' · 조회 ' + post.views;

      btn.appendChild(title);
      btn.appendChild(meta);
      li.appendChild(btn);
      listEl.appendChild(li);
    });
  }

  function openDetail(id) {
    var post = posts.find(function (p) { return p.id === id; });
    if (!post) return;
    post.views += 1;
    savePosts(posts);
    activePostId = id;

    document.getElementById('d-title').textContent = post.title;
    document.getElementById('d-meta').textContent = post.author + ' · ' + post.date + ' · 조회 ' + post.views;
    document.getElementById('d-content').textContent = post.content;
    showView(viewDetail);
  }

  document.getElementById('btn-new').addEventListener('click', function () {
    document.getElementById('write-form').reset();
    showView(viewWrite);
  });

  document.getElementById('btn-cancel-write').addEventListener('click', function () {
    showView(viewList);
  });

  document.getElementById('write-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = document.getElementById('f-title').value.trim();
    var author = document.getElementById('f-author').value.trim();
    var content = document.getElementById('f-content').value.trim();
    if (!title || !author || !content) return;

    posts.push({
      id: Date.now(),
      title: title,
      author: author,
      date: formatToday(),
      content: content,
      views: 0
    });
    savePosts(posts);
    renderList();
    showView(viewList);
  });

  document.getElementById('btn-back').addEventListener('click', function () {
    renderList();
    showView(viewList);
  });

  document.getElementById('btn-delete').addEventListener('click', function () {
    if (!confirm('이 글을 삭제할까요?')) return;
    posts = posts.filter(function (p) { return p.id !== activePostId; });
    savePosts(posts);
    renderList();
    showView(viewList);
  });

  renderList();
})();
</script>

</body>
</html>
